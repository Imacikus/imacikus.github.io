<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Premium PhotoBox - Sidebar Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #00f2fe;
            --glass: rgba(255, 255, 255, 0.08);
            --glass-strong: rgba(255, 255, 255, 0.15);
        }

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: 'Inter', sans-serif;
            background: #0a0a12; color: white; overflow: hidden;
        }

        .bg-animate { position: fixed; inset: 0; background: linear-gradient(45deg, #0f0c29, #24243e); z-index: -2; }
        .screen { display: none; position: absolute; inset: 0; flex-direction: column; align-items: center; justify-content: center; }
        .active { display: flex; animation: fadeIn 0.5s; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Kamera-Menü oben rechts */
        #admin-menu { position: fixed; top: 20px; right: 20px; z-index: 1000; display: flex; flex-direction: column; align-items: flex-end; }
        .cam-select { background: var(--glass-strong); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 10px; border-radius: 12px; display: none; margin-top: 10px; outline: none; }
        .gear-icon { font-size: 24px; cursor: pointer; opacity: 0.5; transition: 0.3s; }

        /* Booth Layout mit Sidebar */
        .booth-container {
            display: flex; gap: 30px; width: 95vw; height: 80vh;
            align-items: stretch; justify-content: center;
        }

        #cam-area { 
            flex-grow: 1; position: relative; border-radius: 40px; overflow: hidden; 
            border: 2px solid rgba(255,255,255,0.2); background: black;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

        /* Der Streifen am Rand */
        #sidebar {
            width: 200px; background: var(--glass); backdrop-filter: blur(25px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 40px;
            display: flex; flex-direction: column; gap: 15px; padding: 20px;
            overflow-y: auto; align-items: center;
        }
        .sidebar-thumb {
            width: 100%; border-radius: 15px; border: 2px solid var(--accent);
            animation: slideIn 0.4s ease-out; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        @keyframes slideIn { from { transform: translateX(50px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        #countdown { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 15rem; font-weight: 900; text-shadow: 0 0 40px var(--accent); }

        /* Glass Cards & Buttons */
        .glass-card { background: var(--glass); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.1); border-radius: 40px; padding: 3rem; text-align: center; }
        .btn-mode { width: 180px; padding: 30px; cursor: pointer; border-radius: 25px; transition: 0.3s; margin: 10px; border: 1px solid rgba(255,255,255,0.1); }
        .btn-mode:hover { border-color: var(--accent); transform: translateY(-10px); background: var(--glass-strong); }
        .id-display { font-size: 5rem; font-weight: 900; color: var(--accent); margin-bottom: 20px; letter-spacing: 10px; }
        .btn-save { padding: 20px 50px; border-radius: 100px; border: none; background: var(--accent); font-weight: bold; cursor: pointer; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="bg-animate"></div>

    <div id="admin-menu">
        <div class="gear-icon" onclick="toggleCamMenu()">⚙️</div>
        <select id="videoSource" class="cam-select" onchange="changeCamera()"></select>
    </div>

    <div id="screen-start" class="screen active">
        <h1 style="letter-spacing: 15px; font-weight: 900; margin-bottom: 40px;">STUDIO</h1>
        <div style="display: flex;">
            <div class="glass-card btn-mode" onclick="startBooth(1)"><h2>1</h2><p>Einzelbild</p></div>
            <div class="glass-card btn-mode" onclick="startBooth(3)"><h2>3</h2><p>Streifen</p></div>
            <div class="glass-card btn-mode" onclick="startBooth(5)"><h2>5</h2><p>Serie</p></div>
        </div>
    </div>

    <div id="screen-booth" class="screen">
        <div class="booth-container">
            <div id="cam-area">
                <video id="video" autoplay playsinline></video>
                <div id="countdown"></div>
            </div>
            <div id="sidebar">
                </div>
        </div>
    </div>

    <div id="screen-result" class="screen">
        <div class="glass-card">
            <div id="result-container" style="display:none;"></div>
            <div style="opacity: 0.6; text-transform: uppercase; letter-spacing: 2px;">Deine Nummer</div>
            <div class="id-display" id="photo-id-text">----</div>
            <button class="btn-save" onclick="downloadCollage()">Speichern & Beenden</button>
        </div>
    </div>

    <canvas id="canvas-export" style="display:none;"></canvas>
    <canvas id="canvas-cam" style="display:none;"></canvas>

<script>
    let state = { mode: 1, count: 0, photoID: 0, currentStream: null };
    const video = document.getElementById('video');
    const videoSelect = document.getElementById('videoSource');
    const sidebar = document.getElementById('sidebar');

    async function getCameras() {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(device => device.kind === 'videoinput');
        videoSelect.innerHTML = videoDevices.map(device => 
            `<option value="${device.deviceId}">${device.label || 'Kamera ' + (videoSelect.length + 1)}</option>`
        ).join('');
    }

    function toggleCamMenu() { videoSelect.style.display = videoSelect.style.display === 'block' ? 'none' : 'block'; }

    async function changeCamera() {
        if (state.currentStream) { state.currentStream.getTracks().forEach(track => track.stop()); }
        const videoSource = videoSelect.value;
        const constraints = { video: { deviceId: videoSource ? { exact: videoSource } : undefined, width: 1920, height: 1080 } };
        state.currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = state.currentStream;
    }

    async function startBooth(m) {
        state.mode = m;
        state.count = 0;
        state.photoID = Math.floor(1000 + Math.random() * 9000);
        document.getElementById('result-container').innerHTML = '';
        sidebar.innerHTML = ''; // Sidebar leeren für neuen Durchgang
        showScreen('screen-booth');
        if (!state.currentStream) await changeCamera();
        setTimeout(cycle, 1500);
    }

    function cycle() {
        if (state.count < state.mode) {
            let timer = 5;
            const cd = document.getElementById('countdown');
            cd.innerText = timer;
            const interval = setInterval(() => {
                timer--;
                cd.innerText = timer > 0 ? timer : "SMILE!";
                if (timer <= 0) {
                    clearInterval(interval);
                    setTimeout(() => {
                        takeSnap();
                        state.count++;
                        cd.innerText = "";
                        setTimeout(cycle, 1200);
                    }, 500);
                }
            }, 1000);
        } else {
            document.getElementById('photo-id-text').innerText = state.photoID;
            setTimeout(() => showScreen('screen-result'), 1000);
        }
    }

    function takeSnap() {
        const camCanvas = document.getElementById('canvas-cam');
        camCanvas.width = video.videoWidth;
        camCanvas.height = video.videoHeight;
        const ctx = camCanvas.getContext('2d');
        ctx.translate(camCanvas.width, 0); ctx.scale(-1, 1);
        ctx.drawImage(video, 0, 0);
        const data = camCanvas.toDataURL('image/jpeg');
        
        // Foto im versteckten Container für Export speichern
        const r = document.createElement('img'); r.src = data;
        document.getElementById('result-container').appendChild(r);

        // Foto in der Sidebar anzeigen
        const thumb = document.createElement('img');
        thumb.src = data;
        thumb.className = 'sidebar-thumb';
        sidebar.prepend(thumb); // Das neueste Bild kommt nach oben
    }

    function downloadCollage() {
        const imgs = document.getElementById('result-container').getElementsByTagName('img');
        const exportCanvas = document.getElementById('canvas-export');
        const ctx = exportCanvas.getContext('2d');
        exportCanvas.width = imgs[0].naturalWidth;
        exportCanvas.height = imgs[0].naturalHeight * state.mode;
        for (let i = 0; i < imgs.length; i++) { ctx.drawImage(imgs[i], 0, i * imgs[0].naturalHeight); }
        const link = document.createElement('a');
        link.download = `Foto_${state.photoID}.jpg`;
        link.href = exportCanvas.toDataURL('image/jpeg', 0.9);
        link.click();
        location.reload();
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    navigator.mediaDevices.getUserMedia({ video: true }).then(() => getCameras());
</script>
</body>
</html>
