<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Fotobox Schulsommerfest 10c</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #ff9a3c;
            --accent-glow: rgba(255, 154, 60, 0.35);
            --glass: rgba(255, 255, 255, 0.12);
            --glass-strong: rgba(255, 255, 255, 0.2);
            --bg-1: #ffecd2;
            --bg-2: #fcb69f;
            --text: #874f00;
        }

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
            color: var(--text); overflow: hidden;
        }

        .bg-animate { position: fixed; inset: 0; background: radial-gradient(circle at top left, rgba(255,255,255,0.6), transparent 35%), radial-gradient(circle at bottom right, rgba(255,153,60,0.3), transparent 30%), linear-gradient(135deg, var(--bg-1), var(--bg-2)); z-index: -2; }
        .screen { display: none; position: absolute; inset: 0; flex-direction: column; align-items: center; justify-content: center; }
        .active { display: flex; animation: fadeIn 0.5s; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Kamera-Menü oben rechts */
        #admin-menu { position: fixed; top: 20px; right: 20px; z-index: 1000; display: flex; flex-direction: column; align-items: flex-end; }
        .cam-select { background: var(--glass-strong); backdrop-filter: blur(10px); border: 1px solid rgba(0,0,0,0.12); color: var(--text); padding: 10px; border-radius: 12px; display: none; margin-top: 10px; outline: none; }
        .gear-icon { font-size: 26px; cursor: pointer; opacity: 0.75; transition: 0.3s; }

        /* Booth Layout */
        .booth-container { display: flex; gap: 30px; width: 95vw; height: 80vh; align-items: stretch; justify-content: center; }
        #cam-area { flex-grow: 1; position: relative; border-radius: 40px; overflow: hidden; border: 2px dashed rgba(255,255,255,0.35); background: linear-gradient(180deg, rgba(255,255,255,0.1), rgba(255,255,255,0)); box-shadow: 0 16px 40px rgba(0,0,0,0.12); }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

        #sidebar { width: 220px; background: var(--glass); backdrop-filter: blur(20px); border: 1px solid rgba(0,0,0,0.1); border-radius: 40px; display: flex; flex-direction: column; gap: 15px; padding: 20px; overflow-y: auto; align-items: center; }
        .sidebar-thumb { width: 100%; border-radius: 18px; border: 2px solid rgba(255,154,60,0.75); animation: slideIn 0.4s ease-out; }

        @keyframes slideIn { from { transform: translateX(50px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        #countdown { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 15rem; font-weight: 900; text-shadow: 0 0 40px var(--accent); }

        /* Glass Cards & Buttons */
        .glass-card { background: var(--glass); backdrop-filter: blur(25px); border: 1px solid rgba(0,0,0,0.08); border-radius: 40px; padding: 3rem; text-align: center; position: relative; box-shadow: 0 20px 40px rgba(0,0,0,0.08); }
        
        .btn-mode { 
            width: 220px; padding: 28px 18px; cursor: pointer; border-radius: 30px; 
            transition: 0.3s; margin: 10px; border: 1px solid rgba(0,0,0,0.08);
            display: flex; flex-direction: column; align-items: center; gap: 5px;
            background: rgba(255,255,255,0.7);
            color: var(--text);
        }
        .btn-mode:hover { border-color: rgba(255,154,60,0.9); transform: translateY(-10px); background: rgba(255,255,255,0.9); }

        /* Bestseller Highlight */
        .btn-mode.highlight {
            border: 2px solid var(--accent);
            background: rgba(255,154,60,0.2);
            box-shadow: 0 0 30px var(--accent-glow);
            transform: scale(1.05);
        }
        .btn-mode.highlight:hover {
            transform: scale(1.05) translateY(-5px);
        }

        /* Bestseller Badge */
        .badge {
            position: absolute;
            top: -15px;
            background: var(--accent);
            color: #fff;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 6px 20px rgba(255,154,60,0.4);
        }

        .price-tag {
            font-weight: 900; color: var(--accent); font-size: 1.5rem; margin-top: 10px;
            background: rgba(255,154,60,0.15); padding: 5px 18px; border-radius: 15px;
            border: 1px solid rgba(255,154,60,0.35);
        }

        .id-display { font-size: 4.5rem; font-weight: 900; color: var(--accent); margin-bottom: 20px; letter-spacing: 8px; }
        .btn-save { padding: 20px 50px; border-radius: 100px; border: none; background: var(--accent); color: #fff; font-weight: bold; cursor: pointer; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="bg-animate"></div>

    <div id="admin-menu">
        <div class="gear-icon" onclick="toggleCamMenu()">⚙️</div>
        <select id="videoSource" class="cam-select" onchange="changeCamera()"></select>
    </div>

    <div id="screen-start" class="screen active">
        <h1 style="letter-spacing: 8px; font-weight: 900; margin-bottom: 20px;">SCHULSOMMERFEST FOTOBOX</h1>
        <p style="max-width: 600px; opacity: 0.85; margin-bottom: 20px; font-size: 1rem;">Halte deinen Sommerfest-Moment fest! Wähle dein Format und lass dich in einer bunten Foto-Session ablichten.</p>
        <div style="display: flex; align-items: center; flex-wrap: wrap; justify-content: center; gap: 18px;">
            <div class="glass-card btn-mode" onclick="startBooth(1)">
                <h2>1er</h2><p>Einzelbild</p>
                <div class="price-tag">1,50€</div>
            </div>

            <div class="glass-card btn-mode highlight" onclick="startBooth(3)">
                <div class="badge">Top</div>
                <h2>3er</h2><p>Streifen</p>
                <div class="price-tag">2€</div>
            </div>

            <div class="glass-card btn-mode" onclick="startBooth(5)">
                <h2>5er</h2><p>Serie</p>
                <div class="price-tag">3€</div>
            </div>
        </div>
    </div>

    <div id="screen-booth" class="screen">
        <div class="booth-container">
            <div id="cam-area">
                <video id="video" autoplay playsinline></video>
                <div id="countdown"></div>
            </div>
            <div id="sidebar"></div>
        </div>
    </div>

    <div id="screen-result" class="screen">
        <div class="glass-card">
            <div id="result-container" style="display:none;"></div>
            <div style="opacity: 0.7; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px;">Fotobox ID</div>
            <div class="id-display" id="photo-id-text">----</div>
            <button class="btn-save" onclick="downloadCollage()">Foto speichern</button>
            <p style="opacity: 0.75; margin-top: 18px; font-size: 0.95rem;">Danke fürs Mitmachen beim Schulsommerfest! Dein Foto wird gleich heruntergeladen.</p>
        </div>
    </div>

    <canvas id="canvas-export" style="display:none;"></canvas>
    <canvas id="canvas-cam" style="display:none;"></canvas>

<script>
    let state = { mode: 1, count: 0, photoID: 0, currentStream: null };
    const video = document.getElementById('video');
    const videoSelect = document.getElementById('videoSource');
    const sidebar = document.getElementById('sidebar');

    async function getCameras() {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(device => device.kind === 'videoinput');
        videoSelect.innerHTML = videoDevices.map(device => 
            `<option value="${device.deviceId}">${device.label || 'Kamera ' + (videoSelect.length + 1)}</option>`
        ).join('');
    }

    function toggleCamMenu() { videoSelect.style.display = videoSelect.style.display === 'block' ? 'none' : 'block'; }

    async function changeCamera() {
        if (state.currentStream) { state.currentStream.getTracks().forEach(track => track.stop()); }
        const videoSource = videoSelect.value;
        const constraints = { video: { deviceId: videoSource ? { exact: videoSource } : undefined, width: 1920, height: 1080 } };
        state.currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = state.currentStream;
    }

    async function startBooth(m) {
        state.mode = m;
        state.count = 0;
        state.photoID = Math.floor(1000 + Math.random() * 9000);
        document.getElementById('result-container').innerHTML = '';
        sidebar.innerHTML = '';
        showScreen('screen-booth');
        if (!state.currentStream) await changeCamera();
        setTimeout(cycle, 1500);
    }

    function cycle() {
        if (state.count < state.mode) {
            let timer = 5; // Countdown bleibt fix bei 5 Sekunden
            const cd = document.getElementById('countdown');
            cd.innerText = timer;
            const interval = setInterval(() => {
                timer--;
                cd.innerText = timer > 0 ? timer : "SMILE!";
                if (timer <= 0) {
                    clearInterval(interval);
                    setTimeout(() => {
                        takeSnap();
                        state.count++;
                        cd.innerText = "";
                        setTimeout(cycle, 1200);
                    }, 500);
                }
            }, 1000);
        } else {
            document.getElementById('photo-id-text').innerText = state.photoID;
            setTimeout(() => showScreen('screen-result'), 1000);
        }
    }

    function takeSnap() {
        const camCanvas = document.getElementById('canvas-cam');
        camCanvas.width = video.videoWidth;
        camCanvas.height = video.videoHeight;
        const ctx = camCanvas.getContext('2d');
        ctx.translate(camCanvas.width, 0); ctx.scale(-1, 1);
        ctx.drawImage(video, 0, 0);
        const data = camCanvas.toDataURL('image/jpeg');
        const r = document.createElement('img'); r.src = data;
        document.getElementById('result-container').appendChild(r);
        const thumb = document.createElement('img');
        thumb.src = data;
        thumb.className = 'sidebar-thumb';
        sidebar.prepend(thumb);
    }

    function downloadCollage() {
        const imgs = document.getElementById('result-container').getElementsByTagName('img');
        const exportCanvas = document.getElementById('canvas-export');
        const ctx = exportCanvas.getContext('2d');
        exportCanvas.width = imgs[0].naturalWidth;
        exportCanvas.height = imgs[0].naturalHeight * state.mode;
        for (let i = 0; i < imgs.length; i++) { ctx.drawImage(imgs[i], 0, i * imgs[0].naturalHeight); }
        const link = document.createElement('a');
        link.download = `Foto_${state.photoID}.jpg`;
        link.href = exportCanvas.toDataURL('image/jpeg', 0.9);
        link.click();
        location.reload();
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    navigator.mediaDevices.getUserMedia({ video: true }).then(() => getCameras());
</script>
</body>
</html>
