<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countdown Timer</title>
  <style>
    /* Grunddesign */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    html, body {
      height: 100%;
      background: linear-gradient(135deg, #0f0f0f, #1f1f1f);
      overflow: hidden;
      color: white;
    }

    /* Animierter Hintergrund (Neon Pulse) */
    body::before {
      content: "";
      position: absolute;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at center, rgba(0,255,255,0.15), transparent 60%),
                  radial-gradient(circle at 80% 20%, rgba(255,0,255,0.1), transparent 50%),
                  radial-gradient(circle at 20% 80%, rgba(0,255,150,0.1), transparent 50%);
      animation: moveBackground 20s linear infinite;
      z-index: 0;
    }

    @keyframes moveBackground {
      0% { transform: translate(0, 0); }
      50% { transform: translate(-10%, -10%); }
      100% { transform: translate(0, 0); }
    }

    /* Container */
    .container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      backdrop-filter: blur(10px);
      padding: 1rem;
    }

    /* Countdown-Boxen */
    #countdown {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 2rem;
      animation: fadeIn 1s ease forwards;
    }

    .time-box {
      background: rgba(255,255,255,0.05);
      border: 2px solid rgba(0,255,255,0.5);
      border-radius: 15px;
      padding: 1rem 1.5rem;
      min-width: 100px;
      box-shadow: 0 0 20px rgba(0,255,255,0.3);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .time-box:hover {
      transform: scale(1.08);
      box-shadow: 0 0 30px rgba(0,255,255,0.6);
    }

    .time-value {
      font-size: 2rem;
      font-weight: bold;
      background: linear-gradient(90deg, cyan, magenta);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(0,255,255,0.3);
    }

    .time-label {
      font-size: 0.9rem;
      opacity: 0.8;
      margin-top: 0.3rem;
    }

    /* Titel / Header */
    h1 {
      font-size: 1.8rem;
      font-weight: bold;
      margin-bottom: 2rem;
      background: linear-gradient(90deg, cyan, magenta);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0.9;
      letter-spacing: 1px;
      animation: fadeIn 1.5s ease forwards;
    }

    /* Subtext */
    p {
      margin-top: 1rem;
      font-size: 1.2rem;
      opacity: 0.7;
      animation: fadeIn 2s ease forwards;
    }

    /* Button-Style */
    .cta {
      margin-top: 2rem;
      padding: 0.8rem 2rem;
      border: 2px solid cyan;
      border-radius: 25px;
      background: transparent;
      color: cyan;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.3s ease;
      animation: fadeIn 2.5s ease forwards;
    }

    .cta:hover {
      background: cyan;
      color: black;
      box-shadow: 0 0 20px cyan;
    }

    /* Hinweiszeile unten */
    .footer-note {
      margin-top: 2rem;
      font-size: 1rem;
      opacity: 0.7;
      color: #ccc;
      animation: fadeIn 3s ease forwards;
    }

    .footer-note span a {
      color: cyan;
      text-decoration: none;
      font-weight: bold;
      text-shadow: 0 0 10px rgba(0,255,255,0.6);
    }

    /* Fade-In Animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Responsive: auf engen Bildschirmen zwei Reihen */
    @media (max-width: 520px) {
      .time-box { min-width: 44%; }
      .time-value { font-size: 1.6rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Countdown bis zum nächsten Rockcamp</h1>

    <div id="countdown">
      <div class="time-box"><div class="time-value">--</div><div class="time-label">Monate</div></div>
      <div class="time-box"><div class="time-value">--</div><div class="time-label">Tage</div></div>
      <div class="time-box"><div class="time-value">--</div><div class="time-label">Stunden</div></div>
      <div class="time-box"><div class="time-value">--</div><div class="time-label">Minuten</div></div>
      <div class="time-box"><div class="time-value">--</div><div class="time-label">Sekunden</div></div>
    </div>

    <button class="cta" onclick="window.location.reload()">Neu laden</button>

    <div class="footer-note">
      Wenn ihr den Countdown auf eurem Handy sehen wollt:<br>
      <span><a href="https://imacikus.github.io/rockcamp.html">imacikus.github.io/rockcamp.html</a></span>
    </div>
  </div>

  <script>
    const target = new Date('2026-10-19T00:00:00');

    function calcMonthsAndRemainder(from, to) {
      // Volle Monate zwischen from und to
      let months = (to.getFullYear() - from.getFullYear()) * 12 + (to.getMonth() - from.getMonth());
      // Erstelle Kandidat-Start + months
      let candidate = new Date(from.getTime());
      candidate.setMonth(candidate.getMonth() + months);

      // Falls candidate > to, einen Monat zurück
      if (candidate > to) {
        months--;
        candidate = new Date(from.getTime());
        candidate.setMonth(candidate.getMonth() + months);
      }

      return { months, remainderStart: candidate }; // remainderStart ist der Zeitpunkt nach Abzug der vollen Monate
    }

    function updateCountdown() {
      const now = new Date();
      if (now >= target) {
        document.getElementById('countdown').innerHTML = "🎉 Heute ist Rockcamp! 🎉";
        return;
      }

      // Monate berechnen und Restzeit ab dem Punkt nach den vollen Monaten
      const { months, remainderStart } = calcMonthsAndRemainder(now, target);
      const remMs = target - remainderStart;

      // Jetzt Tage / Stunden / Minuten / Sekunden aus remMs
      let rem = Math.floor(remMs / 1000);
      const sec = rem % 60;
      rem = Math.floor(rem / 60);
      const min = rem % 60;
      rem = Math.floor(rem / 60);
      const hrs = rem % 24;
      const days = Math.floor(rem / 24);

      const values = [months, days, hrs, min, sec];

      const boxes = document.querySelectorAll('.time-box .time-value');
      boxes.forEach((box, i) => {
        box.textContent = String(values[i]).padStart(2, '0');
      });
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
