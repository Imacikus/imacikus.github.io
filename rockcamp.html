<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countdown Timer</title>
  <style>
    /* Grunddesign */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    html, body {
      height: 100%;
      background: linear-gradient(135deg, #0f0f0f, #1f1f1f);
      overflow: hidden;
      color: white;
    }

    /* Für mobile Geräte – nutzt echte sichtbare Höhe */
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Animierter Hintergrund (Neon Pulse) */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at center, rgba(0,255,255,0.15), transparent 60%),
                  radial-gradient(circle at 80% 20%, rgba(255,0,255,0.1), transparent 50%),
                  radial-gradient(circle at 20% 80%, rgba(0,255,150,0.1), transparent 50%);
      animation: moveBackground 20s linear infinite;
      z-index: 0;
    }

    @keyframes moveBackground {
      0% { transform: translate(0, 0); }
      50% { transform: translate(-10%, -10%); }
      100% { transform: translate(0, 0); }
    }

    /* Container */
    .container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: calc(100dvh - 80px); /* Platz für Footer */
      text-align: center;
      backdrop-filter: blur(10px);
      padding: 1rem;
    }

    /* Countdown-Boxen */
    #countdown {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 2rem;
      animation: fadeIn 1s ease forwards;
    }

    .time-box {
      background: rgba(255,255,255,0.05);
      border: 2px solid rgba(0,255,255,0.5);
      border-radius: 15px;
      padding: 1rem 1.5rem;
      min-width: 90px;
      box-shadow: 0 0 20px rgba(0,255,255,0.3);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .time-box:hover {
      transform: scale(1.08);
      box-shadow: 0 0 30px rgba(0,255,255,0.6);
    }

    .time-value {
      font-size: 2rem;
      font-weight: bold;
      background: linear-gradient(90deg, cyan, magenta);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(0,255,255,0.3);
    }

    .time-label {
      font-size: 0.9rem;
      opacity: 0.8;
      margin-top: 0.3rem;
    }

    /* Titel / Header */
    h1 {
      font-size: 1.8rem;
      font-weight: bold;
      margin-bottom: 2rem;
      background: linear-gradient(90deg, cyan, magenta);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0.9;
      letter-spacing: 1px;
      animation: fadeIn 1.5s ease forwards;
    }

    /* Button-Style */
    .cta {
      margin-top: 2rem;
      padding: 0.8rem 2rem;
      border: 2px solid cyan;
      border-radius: 25px;
      background: transparent;
      color: cyan;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.3s ease;
      animation: fadeIn 2.5s ease forwards;
    }

    .cta:hover {
      background: cyan;
      color: black;
      box-shadow: 0 0 20px cyan;
    }

    /* Hinweiszeile */
    .footer-note {
      margin-top: 2rem;
      font-size: 1rem;
      opacity: 0.7;
      color: #ccc;
      animation: fadeIn 3s ease forwards;
    }

    .footer-note span {
      color: cyan;
      font-weight: bold;
      text-shadow: 0 0 10px rgba(0,255,255,0.6);
    }

    /* Footer */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      border-top: 1px solid rgba(0,255,255,0.2);
      z-index: 3;
      animation: fadeIn 3s ease forwards;
    }

    footer p {
      font-size: 0.9rem;
      color: #aaa;
      opacity: 0.8;
    }

    footer img {
      height: 35px;
      filter: drop-shadow(0 0 10px cyan);
      transition: transform 0.3s ease, filter 0.3s ease;
    }

    footer img:hover {
      transform: scale(1.1);
      filter: drop-shadow(0 0 20px magenta);
    }

    /* Responsives Design */
    @media (max-width: 600px) {
      h1 {
        font-size: 1.4rem;
      }

      .time-box {
        padding: 0.8rem 1rem;
        min-width: 70px;
      }

      .time-value {
        font-size: 1.6rem;
      }

      .footer-note {
        font-size: 0.9rem;
      }

      footer {
        padding: 0.8rem 1.5rem;
      }

      footer img {
        height: 30px;
      }
    }

    /* Fade-In Animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Countdown bis zum nächsten Rockcamp</h1>

    <div id="countdown">
      <div class="time-box"><div class="time-value">--</div><div class="time-label">Monate</div></div>
      <div class="time-box"><div class="time-value">--</div><div class="time-label">Tage</div></div>
      <div class="time-box"><div class="time-value">--</div><div class="time-label">Stunden</div></div>
      <div class="time-box"><div class="time-value">--</div><div class="time-label">Minuten</div></div>
      <div class="time-box"><div class="time-value">--</div><div class="time-label">Sekunden</div></div>
    </div>

    <button class="cta" onclick="window.location.reload()">Neu laden</button>

    <div class="footer-note">
      Wenn ihr den Countdown auf eurem Handy sehen wollt:<br>
      <span><a href="https://imacikus.github.io/rockcamp.html" style="color: cyan; text-decoration: none;">imacikus.github.io/rockcamp.html</a></span>
    </div>
  </div>

  <footer>
    <p>© 2025 All rights reserved</p>
    <img src="pegasus_logo.png" alt="Pegasus Logo">
  </footer>

  <script>
    function updateCountdown() {
      const now = new Date();
      const target = new Date('2026-10-18T13:59:20');
      let diff = target - now;

      if (diff <= 0) {
        document.getElementById('countdown').innerHTML = "🎉 Heute ist Rockcamp! 🎉";
        return;
      }

      const seconds = Math.floor(diff / 1000);
      const minutes = Math.floor(seconds / 60);
      const hours = Math.floor(minutes / 60);
      const days = Math.floor(hours / 24);
      const months = Math.floor(days / 30.44);

      const remDays = Math.floor(days % 30.44);
      const remHours = hours % 24;
      const remMinutes = minutes % 60;
      const remSeconds = seconds % 60;

      const values = [months, remDays, remHours, remMinutes, remSeconds];
      const boxes = document.querySelectorAll('.time-box .time-value');

      boxes.forEach((box, i) => {
        box.textContent = values[i].toString().padStart(2, '0');
      });
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
