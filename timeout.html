<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lewin Timeout Button - GEIL!</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #2c3e50; /* Dunkler Hintergrund */
            font-family: Arial, sans-serif;
            color: white;
            transition: background-color 0.5s ease;
        }

        #timeout-button {
            padding: 50px 100px; /* RIESIGER KNOPF */
            font-size: 40px;
            font-weight: bold;
            color: white;
            background-color: #e74c3c; /* Aggressive rote Farbe */
            border: 10px solid #c0392b;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 15px #c0392b;
            transition: all 0.1s;
        }

        #timeout-button:active {
            box-shadow: 0 5px #c0392b;
            transform: translateY(10px);
        }

        #message {
            margin-top: 30px;
            font-size: 30px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .timed-out {
            background-color: #34495e !important; /* Hintergrund ändert sich, wenn er getimed-out wird */
        }
    </style>
</head>
<body>

    <h1>🚨 LEWIN TIMEOUT-ZENTRALE 🚨</h1>
    <p>Drücke den Knopf, um Levin für 15 Sekunden irl zu timeouten!</p>

    <button id="timeout-button" onclick="timeoutLewin()">TIMEOUT LEVIN!</button>

    <div id="message"></div>

    <script>
        function timeoutLewin() {
            const button = document.getElementById('timeout-button');
            const message = document.getElementById('message');
            const body = document.body;

            // 1. Knopf deaktivieren und Stil ändern
            button.disabled = true;
            button.textContent = 'Lewin ist im Timeout... (15s)';
            button.style.backgroundColor = '#95a5a6'; // Graue Farbe
            button.style.borderColor = '#7f8c8d';
            body.classList.add('timed-out');

            // 2. Nachricht anzeigen
            message.textContent = 'LEVIN IST WEGGESPERRT. Zzzzz...';
            message.style.opacity = 1;

            // 3. Nach 15 Sekunden zurücksetzen
            setTimeout(() => {
                button.disabled = false;
                button.textContent = 'TIMEOUT LEWIN!';
                button.style.backgroundColor = '#e74c3c'; // Rote Farbe zurück
                button.style.borderColor = '#c0392b';
                body.classList.remove('timed-out');
                message.style.opacity = 0;
            }, 15000); // 15 Sekunden = 15000 Millisekunden
        }
    </script>

</body>
</html>
