<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Ultimate MC Leaderboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a0c;
            --card-bg: rgba(255, 255, 255, 0.05);
            --mc-green: #3fb52d;
            --mc-gold: #ffcc00;
            --accent-blue: #00d4ff;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(63, 181, 45, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 212, 255, 0.05) 0%, transparent 40%);
            color: white;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }

        h1 {
            font-family: 'Press Start 2P', cursive;
            font-size: 2.5em;
            margin: 40px 0;
            color: white;
            text-shadow: 0 0 20px rgba(63, 181, 45, 0.6);
            letter-spacing: 5px;
        }

        #leaderboard {
            position: relative;
            width: 80%;
            max-width: 1000px;
            margin-top: 20px;
        }

        .player-card {
            position: absolute;
            width: 100%;
            height: 70px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            padding: 0 40px;
            border-radius: 12px;
            box-sizing: border-box;
            /* DAS ist die magische Animation für das Verschieben */
            transition: all 0.7s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        /* Platz 1 bekommt ein Special-Design */
        .player-card[data-rank="1"] {
            height: 90px;
            background: linear-gradient(90deg, rgba(255, 204, 0, 0.1), rgba(255, 204, 0, 0.2));
            border: 2px solid var(--mc-gold);
            box-shadow: 0 0 40px rgba(255, 204, 0, 0.2);
            z-index: 10;
        }

        .rank-circle {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1.5em;
            margin-right: 25px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .player-card[data-rank="1"] .rank-circle {
            background: var(--mc-gold);
            color: black;
            transform: scale(1.2);
        }

        .name {
            font-size: 1.8em;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 2px;
            flex-grow: 1;
        }

        .score-container {
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        .score {
            font-family: 'Press Start 2P', cursive;
            font-size: 1.5em;
            color: var(--accent-blue);
            transition: transform 0.3s ease;
        }

        /* Animation wenn Punkte steigen */
        .score-up {
            animation: score-pop 0.5s ease-out;
            color: var(--mc-green) !important;
        }

        @keyframes score-pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.5); }
            100% { transform: scale(1); }
        }

        .unit { font-size: 0.8em; color: rgba(255,255,255,0.4); }

    </style>
</head>
<body>

    <h1>LEADERBOARD</h1>

    <div id="leaderboard"></div>

    <script>
        let lastData = {};

        function updateDisplay() {
            const data = JSON.parse(localStorage.getItem('mc_leaderboard') || '[]');
            const container = document.getElementById('leaderboard');
            
            // Sortieren
            data.sort((a, b) => b.score - a.score);

            data.forEach((player, index) => {
                let el = document.getElementById('p-' + player.id);
                
                // Falls Spieler neu, Element erstellen
                if (!el) {
                    el = document.createElement('div');
                    el.id = 'p-' + player.id;
                    el.className = 'player-card';
                    container.appendChild(el);
                }

                // Check ob Score sich geändert hat für Animation
                const scoreEl = el.querySelector('.score');
                if (scoreEl && lastData[player.id] !== undefined && lastData[player.id] < player.score) {
                    scoreEl.classList.remove('score-up');
                    void scoreEl.offsetWidth; // Reflow Trigger für Animation
                    scoreEl.classList.add('score-up');
                }
                lastData[player.id] = player.score;

                // Position und Daten setzen
                const verticalOffset = index * 85 + (index > 0 ? 20 : 0); // Platz 1 ist größer
                el.style.top = verticalOffset + "px";
                el.dataset.rank = index + 1;

                el.innerHTML = `
                    <div class="rank-circle">${index + 1}</div>
                    <div class="name">${player.name}</div>
                    <div class="score-container">
                        <span class="score">${player.score}</span>
                        <span class="unit">PTS</span>
                    </div>
                `;
            });
        }

        window.addEventListener('storage', updateDisplay);
        updateDisplay();
    </script>
</body>
</html>
