<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f0f0f0; }
        .controls { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; border-bottom: 1px solid #ccc; text-align: left; }
        input[type="number"] { width: 60px; padding: 5px; }
        button { cursor: pointer; padding: 5px 10px; }
    </style>
</head>
<body>
    <div class="controls">
        <h3>Spieler hinzufügen</h3>
        <input type="text" id="new-player" placeholder="Name">
        <button onclick="addPlayer()">Hinzufügen</button>
        <button onclick="resetData()" style="color: red;">Alles löschen</button>
    </div>

    <table id="admin-table">
        <thead>
            <tr><th>Name</th><th>Punkte</th><th>Aktion</th></tr>
        </thead>
        <tbody id="player-list"></tbody>
    </table>

    <script>
        let players = JSON.parse(localStorage.getItem('mc_leaderboard') || '[]');

        function save() {
            localStorage.setItem('mc_leaderboard', JSON.stringify(players));
            renderAdmin();
            // Trick: Storage Event manuell auslösen für denselben Browser
            window.dispatchEvent(new Event('storage'));
        }

        function addPlayer() {
            const name = document.getElementById('new-player').value;
            if(!name) return;
            players.push({ id: Date.now(), name: name, score: 0 });
            document.getElementById('new-player').value = '';
            save();
        }

        function changeScore(id, amt) {
            const p = players.find(p => p.id === id);
            p.score += amt;
            save();
        }

        function resetData() {
            if(confirm("Wirklich alles löschen?")) {
                players = [];
                save();
                location.reload();
            }
        }

        function renderAdmin() {
            const list = document.getElementById('player-list');
            list.innerHTML = '';
            players.forEach(p => {
                list.innerHTML += `
                    <tr>
                        <td>${p.name}</td>
                        <td><strong>${p.score}</strong></td>
                        <td>
                            <button onclick="changeScore(${p.id}, 1)">+1</button>
                            <button onclick="changeScore(${p.id}, 5)">+5</button>
                            <button onclick="changeScore(${p.id}, -1)">-1</button>
                        </td>
                    </tr>
                `;
            });
        }
        renderAdmin();
    </script>
</body>
</html>
