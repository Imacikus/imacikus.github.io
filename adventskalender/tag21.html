<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>🎄 Adventskalender – Tag 21</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('https://cdn.jsdelivr.net/gh/nikitavoloboev/unsplash-wallpapers/snowfall.gif');
      background-size: cover;
      opacity: 0.12;
      z-index: -1;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-b from-red-200 to-red-400 text-white font-sans">

  <main class="bg-white/20 backdrop-blur-md p-8 rounded-2xl shadow-2xl w-11/12 sm:w-3/4 md:w-1/2 text-center border border-white/30">

    <h1 class="text-4xl font-bold mb-2">🎁 Tag 21 – Lustiges Rätsel</h1>
    <p class="text-sm text-white/90 mb-4">📅 21. Dezember 2025</p>

    <section class="bg-white/10 rounded-xl p-4 mb-4 text-left">
      <p class="text-md leading-relaxed">
        🤔 <strong>Rätsel:</strong><br>
        Ein Mann steht im Regen, aber kein Haar auf seinem Kopf wird nass.<br>
        Er hat keinen Schirm, keine Kapuze und steht nicht unter einem Dach.<br>
        <strong>Warum?</strong>
      </p>
    </section>

    <div class="mb-4">
      <input
        id="answer"
        type="text"
        placeholder="Deine Antwort hier eingeben…"
        class="w-full p-3 rounded-xl text-gray-800 focus:outline-none focus:ring-2 focus:ring-red-400"
      />
    </div>

    <button
      onclick="checkAnswer()"
      class="bg-white text-red-600 font-semibold px-6 py-2 rounded-xl shadow hover:bg-red-50 transition"
    >
      Antwort prüfen
    </button>

    <p id="result" class="mt-4 font-semibold"></p>

  </main>

  <footer class="absolute bottom-4 w-full text-center text-white/80 text-sm">
    <p>© 2025 Adventskalender von Linux 🎄</p>
  </footer>

  <script>
    function checkAnswer() {
      const input = document.getElementById("answer").value.toLowerCase();
      const result = document.getElementById("result");

      if (input.includes("glatze")) {
        result.textContent = "🎉 Richtig! Er hat eine Glatze 😄";
        result.className = "mt-4 font-semibold text-green-200";
      } else {
        result.textContent = "❌ Noch nicht ganz… Denk nochmal nach 😉";
        result.className = "mt-4 font-semibold text-yellow-200";
      }
    }
  </script>

</body>
</html>
