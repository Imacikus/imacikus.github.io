<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>🎄 Adventskalender – Tag 22</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: url('https://cdn.jsdelivr.net/gh/nikitavoloboev/unsplash-wallpapers/snowfall.gif');
      background-size: cover;
      opacity: 0.12;
      z-index: -1;
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center bg-gradient-to-b from-green-200 to-green-500 text-white">

<main class="bg-white/20 backdrop-blur-md p-8 rounded-2xl shadow-2xl w-11/12 sm:w-3/4 md:w-1/2 text-center border border-white/30">

  <h1 class="text-4xl font-bold mb-2">🎁 Tag 22 – Persönlichkeitstest</h1>
  <p class="text-sm text-white/90 mb-4">📅 22. Dezember 2025</p>

  <p class="mb-6 text-lg">❄️ Welcher Weihnachts-Typ bist du?</p>

  <div id="quiz"></div>

  <div id="result" class="hidden mt-6 text-xl font-bold"></div>

</main>

<footer class="absolute bottom-4 w-full text-center text-white/80 text-sm">
  © 2025 Adventskalender von Linux 🎄
</footer>

<script>
const questions = [
  {
    q: "Was machst du an Heiligabend?",
    a: [
      { text: "Geschenke sortieren 🎁", type: "wichtel" },
      { text: "Essen vorbereiten 🍪", type: "rentier" },
      { text: "Chillen 😎", type: "schneemann" }
    ]
  },
  {
    q: "Dein Lieblingswinterwetter?",
    a: [
      { text: "Schnee ❄️", type: "schneemann" },
      { text: "Kalt aber sonnig ☀️", type: "wichtel" },
      { text: "Egal – Hauptsache drinnen 🔥", type: "rentier" }
    ]
  },
  {
    q: "Was würdest du im Adventskalender wollen?",
    a: [
      { text: "Süßigkeiten 🍫", type: "rentier" },
      { text: "Rätsel 🧠", type: "wichtel" },
      { text: "Überraschung 😲", type: "schneemann" }
    ]
  }
];

let index = 0;
let score = { wichtel: 0, rentier: 0, schneemann: 0 };

const quizDiv = document.getElementById("quiz");

function showQuestion() {
  const q = questions[index];
  quizDiv.innerHTML = `
    <h2 class="text-xl font-semibold mb-4">${q.q}</h2>
    ${q.a.map(ans => `
      <button
        onclick="answer('${ans.type}')"
        class="block w-full mb-3 bg-white text-green-700 font-semibold py-2 rounded-xl hover:bg-green-50 transition">
        ${ans.text}
      </button>
    `).join("")}
  `;
}

function answer(type) {
  score[type]++;
  index++;
  if (index < questions.length) {
    showQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  quizDiv.classList.add("hidden");
  const resultDiv = document.getElementById("result");
  resultDiv.classList.remove("hidden");

  const winner = Object.keys(score).reduce((a, b) =>
    score[a] > score[b] ? a : b
  );

  const texts = {
    wichtel: "🧝‍♂️ Du bist ein Weihnachts-Wichtel! Clever, neugierig und immer hilfsbereit.",
    rentier: "🦌 Du bist ein Rentier! Loyal, zuverlässig und liebst gutes Essen.",
    schneemann: "⛄ Du bist ein Schneemann! Entspannt, lustig und immer gut drauf."
  };

  resultDiv.textContent = texts[winner];
}

showQuestion();
</script>

</body>
</html>
