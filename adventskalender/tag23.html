<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🎄 Adventskalender – Tag 23</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background-image: url('https://cdn.jsdelivr.net/gh/nikitavoloboev/unsplash-wallpapers/snowfall.gif');
  background-size: cover;
  opacity: 0.12;
  z-index: -1;
}

.gift {
  position: absolute;
  font-size: 2.5rem;
  cursor: pointer;
  animation: pop 0.3s ease-out;
  user-select: none;
}

@keyframes pop {
  0% { transform: scale(0); }
  80% { transform: scale(1.2); }
  100% { transform: scale(1); }
}
</style>
</head>

<body class="min-h-screen flex items-center justify-center bg-gradient-to-b from-purple-200 to-purple-500 text-white overflow-hidden">

<main class="bg-white/20 backdrop-blur-md p-6 rounded-2xl shadow-2xl w-11/12 sm:w-3/4 md:w-1/2 text-center border border-white/30 relative">

  <h1 class="text-4xl font-bold mb-2">🎁 Tag 23 – Geschenke-Jagd</h1>
  <p class="text-sm mb-4">📅 23. Dezember 2025</p>

  <div class="flex justify-between mb-4 text-lg font-semibold">
    <span>⏱️ Zeit: <span id="time">20</span>s</span>
    <span>⭐ Punkte: <span id="score">0</span></span>
  </div>

  <button
    id="startBtn"
    class="bg-white text-purple-700 px-6 py-2 rounded-xl font-bold shadow hover:bg-purple-50 transition">
    ▶ Spiel starten
  </button>

  <div id="gameArea" class="relative w-full h-96 mt-4 overflow-hidden rounded-xl"></div>

  <div id="endScreen" class="hidden mt-6 text-xl font-bold"></div>

</main>

<footer class="absolute bottom-4 w-full text-center text-white/80 text-sm">
  © 2025 Adventskalender von Linux 🎄
</footer>

<script>
let score = 0;
let time = 20;
let gameInterval;
let timerInterval;

const gameArea = document.getElementById("gameArea");
const scoreEl = document.getElementById("score");
const timeEl = document.getElementById("time");
const startBtn = document.getElementById("startBtn");
const endScreen = document.getElementById("endScreen");

startBtn.onclick = startGame;

function startGame() {
  score = 0;
  time = 20;
  scoreEl.textContent = score;
  timeEl.textContent = time;
  endScreen.classList.add("hidden");
  startBtn.classList.add("hidden");

  // Geschenke langsamer spawnen
  gameInterval = setInterval(spawnGift, 1200);
  timerInterval = setInterval(updateTime, 1000);
}

function spawnGift() {
  const gift = document.createElement("div");
  gift.textContent = "🎁";
  gift.className = "gift";

  const x = Math.random() * (gameArea.clientWidth - 40);
  const y = Math.random() * (gameArea.clientHeight - 40);

  gift.style.left = x + "px";
  gift.style.top = y + "px";

  gift.onclick = () => {
    score++;
    scoreEl.textContent = score;
    gift.remove();
    // Vibration auf Handy
    if (navigator.vibrate) navigator.vibrate(50);
  };

  gameArea.appendChild(gift);

  setTimeout(() => {
    gift.remove();
  }, 1500); // länger sichtbar
}

function updateTime() {
  time--;
  timeEl.textContent = time;

  if (time <= 0) {
    endGame();
  }
}

function endGame() {
  clearInterval(gameInterval);
  clearInterval(timerInterval);
  gameArea.innerHTML = "";

  let message = "🎄 Gut gemacht!";
  if (score >= 15) message = "🧝‍♂️ WICHTEL-PROFI!";
  else if (score >= 8) message = "🦌 Starkes Rentier!";
  else message = "⛄ Übung macht den Meister 😄";

  endScreen.textContent = `Spiel vorbei! ⭐ ${score} Punkte – ${message}`;
  endScreen.classList.remove("hidden");
  startBtn.textContent = "🔁 Nochmal spielen";
  startBtn.classList.remove("hidden");
}
</script>

</body>
</html>
