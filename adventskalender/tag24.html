<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>24. Dezember - Das Finale</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Poppins:wght@900&display=swap" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle at center, #3d0000 0%, #000000 100%);
            margin: 0;
            height: 100vh;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            perspective: 1200px;
        }

        /* Goldener Glanz Effekt */
        .gold-glow {
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8), 0 0 40px rgba(255, 165, 0, 0.5);
        }

        /* Haupt-Tür 24 */
        #door-wrapper {
            position: relative;
            z-index: 100;
            transition: all 1s ease-in-out;
        }

        .door-24 {
            width: 180px;
            height: 250px;
            background: linear-gradient(145deg, #b8860b, #ffd700);
            border: 6px solid #5d4037;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            font-family: 'Mountains of Christmas';
            color: #3d0000;
            cursor: pointer;
            box-shadow: 0 30px 60px rgba(0,0,0,0.7);
            transform-origin: left;
            transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .door-24.open {
            transform: rotateY(-140deg);
        }

        /* Die Parade der fliegenden Tage */
        #parade-track {
            position: absolute;
            top: 50%;
            left: 100%; /* Startet rechts außerhalb */
            display: flex;
            align-items: center;
            gap: 30px;
            pointer-events: none;
            z-index: 10;
            transform: translateY(-50%) rotate(-8deg); /* Schräglage */
        }

        .flying-day {
            min-width: 80px;
            height: 110px;
            background: linear-gradient(135deg, #c0392b, #e74c3c);
            border: 3px solid #ffd700;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffd700;
            font-weight: 900;
            font-size: 1.5rem;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            transition: transform 0.5s ease;
        }

        /* Finale Nachricht */
        #outro {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            text-align: center;
            z-index: 200;
            width: 100%;
            pointer-events: none;
            transition: transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .headline {
            font-family: 'Mountains of Christmas';
            font-size: clamp(3rem, 12vw, 6rem);
            background: linear-gradient(to bottom, #fff, #ffd700, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(255,215,0,0.7));
        }

        /* Animation für das Beschleunigen und Größerwerden */
        @keyframes rush-and-grow {
            0% { 
                left: 100%; 
                transform: translateY(-50%) rotate(-8deg) scale(0.5);
            }
            30% {
                transform: translateY(-50%) rotate(-8deg) scale(0.8);
            }
            100% { 
                left: -4000px; /* Muss weit genug links sein für alle 23 Türen */
                transform: translateY(-50%) rotate(-8deg) scale(2.5); /* Wird massiv größer */
            }
        }

        .start-animation {
            animation: rush-and-grow 5s cubic-bezier(0.45, 0.05, 0.55, 0.95) forwards;
        }
    </style>
</head>
<body class="flex items-center justify-center">

    <div id="door-wrapper">
        <div class="door-24" id="mainDoor">24</div>
    </div>

    <div id="parade-track"></div>

    <div id="outro">
        <h1 class="headline">FROHE<br>WEIHNACHTEN</h1>
        <div class="text-white text-2xl mt-4 opacity-0" id="subtext">24. DEZEMBER</div>
    </div>

    <script>
        const door = document.getElementById('mainDoor');
        const wrapper = document.getElementById('door-wrapper');
        const track = document.getElementById('parade-track');
        const outro = document.getElementById('outro');
        const subtext = document.getElementById('subtext');

        // Erstelle Tage 1-23
        for(let i=1; i<=23; i++) {
            const div = document.createElement('div');
            div.className = 'flying-day';
            div.innerText = i;
            track.appendChild(div);
        }

        door.onclick = () => {
            // 1. Initialer Schlag beim Öffnen
            vibrate([100, 50, 100]);
            door.classList.add('open');

            setTimeout(() => {
                // 2. 24er Tür zieht sich zurück
                wrapper.style.transform = "translateZ(-800px) scale(0)";
                wrapper.style.opacity = "0";
                
                // 3. Parade startet
                setTimeout(triggerParade, 500);
            }, 1000);
        };

        function triggerParade() {
            track.classList.add('start-animation');
            
            // 4. Vibration, die mit der Beschleunigung intensiver wird
            let count = 0;
            const vibInterval = setInterval(() => {
                // Kurze Impulse, die schneller aufeinander folgen könnten
                vibrate(20);
                count++;
                if(count > 40) clearInterval(vibInterval);
            }, 120);

            // 5. Finale nach der Parade
            setTimeout(() => {
                showOutro();
            }, 4800);
        }

        function showOutro() {
            outro.style.transform = "translate(-50%, -50%) scale(1.2)";
            vibrate([0, 200, 100, 200, 100, 500]);
            
            setTimeout(() => {
                subtext.classList.remove('opacity-0');
                subtext.classList.add('animate-bounce');
            }, 1000);
        }

        function vibrate(pattern) {
            if (navigator.vibrate) {
                navigator.vibrate(pattern);
            }
        }
    </script>
</body>
</html>
