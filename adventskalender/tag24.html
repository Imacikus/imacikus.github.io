<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎄 Adventskalender – Tag 24</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body::before {
  content:"";
  position:fixed;
  inset:0;
  background:url("https://cdn.jsdelivr.net/gh/nikitavoloboev/unsplash-wallpapers/snowfall.gif");
  background-size:cover;
  opacity:.12;
  z-index:-1;
}

#door24 {
  width: 120px;
  height: 160px;
  background: #f59e0b;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 3rem;
  font-weight: bold;
  cursor: pointer;
  margin: auto;
  position: relative;
  top: 50px;
  transition: transform 0.7s ease-in-out;
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}

#door24.open {
  transform: rotateY(180deg);
}

#parade {
  position: absolute;
  top: 220px;
  left: 100%;
  display: flex;
  gap: 10px;
}

.parade-door {
  width: 50px;
  height: 70px;
  background: #f87171;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  color: white;
  font-size: 1.2rem;
  transform: rotate(-10deg);
}

#message {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  font-size: 2rem;
  font-weight: bold;
  color: #facc15;
  text-shadow: 0 0 10px #facc15, 0 0 20px #fcd34d;
  transition: transform 1s ease-in-out;
}
#message.show {
  transform: translate(-50%, -50%) scale(1);
}
</style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-b from-red-200 to-red-500 text-white overflow-hidden">

<div id="door24">24</div>
<div id="parade"></div>
<div id="message">🎄 Heute ist Weihnachten! 🎁</div>

<script>
const door = document.getElementById("door24");
const parade = document.getElementById("parade");
const message = document.getElementById("message");

door.onclick = () => {
  door.classList.add("open");
  if(navigator.vibrate) navigator.vibrate(100);

  setTimeout(startParade, 800);
}

function startParade(){
  // Erstelle die Türchen 1-23
  for(let i=1;i<=23;i++){
    const div = document.createElement("div");
    div.className="parade-door";
    div.textContent=i;
    div.style.transform = `rotate(${Math.random()*6-3}deg)`; // leichte zufällige Schrägung
    parade.appendChild(div);
  }

  let position = window.innerWidth;
  const interval = setInterval(()=>{
    position -= 2; // Geschwindigkeit
    parade.style.left = position + "px";
    if(position < -parade.scrollWidth){
      clearInterval(interval);
      parade.innerHTML="";
      showMessage();
    }
  },16); // ca. 60fps
}

function showMessage(){
  message.classList.add("show");
  if(navigator.vibrate) navigator.vibrate([50,50,50]);
}
</script>

</body>
</html>
